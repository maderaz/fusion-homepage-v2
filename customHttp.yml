# This template is resolving during processing pre-step in AWS Amplify
customHeaders:
  - pattern: '**'
    headers:
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' https://www.googletagmanager.com https://www.google-analytics.com 'sha256-+o64wVCTyTYLjHdEKVGq9Q6Q+EEd/L7DixmGdpSiMNY=' 'sha256-7fQDSJe6cTopxsqzM+Upkm6ebeNy+v/wndFI75XqFeI=' 'sha256-HB0BjStz33BLwSeX/guEK2YdEQEe/9PylMtvt4U7ESg=' 'sha256-Q2BPg90ZMplYY+FSdApNErhpWafg2hcRRbndmvxuL/Q=' 'sha256-QJZDUlo/qa5AJCrG6vHyWcatjwCeWidEHQfJc601lzw=' 'sha256-QzWFZi+FLIx23tnm9SBU4aEgx4x8DsuASP07mfqol/c=' 'sha256-iWdS2jWTpnr+3BJVEvyuQTd4EXycjnG1I1R85aSny/I='; img-src 'self' data: https://www.googletagmanager.com https://www.google-analytics.com; connect-src 'self' https://api.ipor.io https://*.google-analytics.com https://*.analytics.google.com; frame-src 'none'; object-src 'none'"
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000 ; includeSubDomains'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Access-Control-Allow-Credentials'
        value: 'true'
      - key: 'Access-Control-Allow-Headers'
        value: '*'
      - key: 'Access-Control-Allow-Methods'
        value: 'GET,OPTIONS'
      - key: 'Access-Control-Max-Age'
        value: '600'
      - key: 'Access-Control-Expose-Headers'
        value: '*'
      - key: 'Access-Control-Request-Headers'
        value: '*'
      - key: 'Access-Control-Request-Method'
        value: 'GET,OPTIONS'
