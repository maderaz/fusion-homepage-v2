name: Deploy on Amplify

on:
  workflow_call:
    secrets:
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false

    inputs:
      aws-region:
        description: 'AWS region in which the application is already configured'
        type: string
        default: eu-central-1
        required: false

      app-name:
        description: 'The name of the web application in AWS Amplify'
        type: string
        required: false

      branch:
        description: 'Git repository branch name from which application will be built'
        type: string
        default: main
        required: false

      extra-args:
        description: 'Extra arguments to AWS Amplify CLI commands'
        type: string
        default: ""
        required: false

jobs:
  amplify:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-on-amplify-${{ inputs.app-name }}-branch-${{ inputs.branch }}
    steps:

      - name: Checkout
        if: "${{ github.event.head_commit.message == '' || github.event.head_commit.timestamp == '' }}"
        # from tag: v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up AWS credentials
        # from tag: v6.0.0
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws-region }}

      - name: Deploy on Amplify
        env:
          APP_NAME: ${{ inputs.app-name }}
          BRANCH: ${{ inputs.branch }}
          EXTRA_ARGS: ${{ inputs.extra-args }}
          COMMIT_ID:  ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_TIME: ${{ github.event.head_commit.timestamp }}
        run: |

          COMMIT_MESSAGE="${COMMIT_MESSAGE:-$(git log -1 --pretty=format:"%s")}"
          COMMIT_TIME="${COMMIT_TIME:-$(git show -s --format=%ct)}"

          echo "Deploy app: ${APP_NAME} from branch: ${BRANCH}"
          APP_ID=$(aws amplify list-apps --query "apps[?name==\`${APP_NAME}\`].appId" --output text ${EXTRA_ARGS})
          echo "${APP_ID}" > amplify-app-id.txt
          echo "App id: ${APP_ID}"
          JOB_ID=$(aws amplify start-job --app-id "${APP_ID}" --branch-name "${BRANCH}" --job-type RELEASE --commit-id "${COMMIT_ID}" --commit-message "${COMMIT_MESSAGE}" --commit-time "${COMMIT_TIME}" --query jobSummary.jobId --output text ${EXTRA_ARGS})
          echo "${JOB_ID}" > amplify-job-id.txt
          echo "Job number: ${JOB_ID}"

          STATUS=RUNNING
          while [[ "${STATUS}" =~ ^(PENDING|RUNNING)$ ]];
          do
            echo "Wait 10 seconds..."
            sleep 10
            STATUS=$(aws amplify get-job --app-id "${APP_ID}" --branch-name "${BRANCH}" --job-id "${JOB_ID}" --query job.summary.status --output text ${EXTRA_ARGS})
            echo "Job status: ${STATUS}"
          done

          echo -e "\n\nAmplify job number: ${JOB_ID} on app: ${APP_NAME} from branch: ${BRANCH} finished with status: ${STATUS}. Go to AWS Amplify dashboard for more details.\n\n"

          echo "Downloading Amplify build and deploy logs of ${STATUS} status:"
          BUILD_LOG_URL=$(aws amplify get-job --app-id "${APP_ID}" --branch-name "${BRANCH}" --job-id "${JOB_ID}" --query "job.steps[?stepName == 'BUILD'].logUrl" | jq -r .[])
          DEPLOY_LOG_URL=$(aws amplify get-job --app-id "${APP_ID}" --branch-name "${BRANCH}" --job-id "${JOB_ID}" --query "job.steps[?stepName == 'DEPLOY'].logUrl" | jq -r .[])
          echo -e "\nAmplify build step log:\n"
          curl -s "${BUILD_LOG_URL}"
          echo -e "\nEnd of Amplify build step log."
          echo -e "\nAmplify deploy step log:\n"
          curl -s "${DEPLOY_LOG_URL}"
          echo -e "\nEnd of Amplify deploy step log."
          
          if [ "${STATUS}" != "SUCCEED" ]; then
            exit 1
          fi

      - name: Stop on cancel
        if: cancelled()
        env:
          APP_NAME: ${{ inputs.app-name }}
          BRANCH: ${{ inputs.branch }}
        run: |
          if [ -f amplify-job-id.txt ]; then
            AMPLIFY_APP_ID=$(cat amplify-app-id.txt)
            AMPLIFY_JOB_ID=$(cat amplify-job-id.txt)
          
            echo "Attempting to stop ${APP_NAME} Amplify job: ${AMPLIFY_JOB_ID}"
          
            if aws amplify stop-job \
              --app-id "${AMPLIFY_APP_ID}" \
              --branch-name "${BRANCH}" \
              --job-id "${AMPLIFY_JOB_ID}"; then
              echo "Successfully cancelled ${APP_NAME} Amplify deployment in job: ${AMPLIFY_JOB_ID}"
            else
              echo "Failed to cancel ${APP_NAME} Amplify deployment in job: ${AMPLIFY_JOB_ID}"
              exit 1
            fi
          else
            echo "No Amplify job ID found, deployment was not started - nothing to stop"
            exit 1
          fi
